
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Client Login | Itrace</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:linear-gradient(135deg,#071b38,#1255a0);color:#172b4d;min-height:100vh;display:flex;flex-direction:column}
header{padding:22px 7%;color:white;font-size:25px;font-weight:bold}
header span{color:#65d4ff}
main{width:92%;max-width:440px;margin:30px auto 45px;background:white;border-radius:20px;padding:30px;box-shadow:0 15px 45px #00132d55}
h1{margin:0 0 10px;font-size:27px}
.sub{color:#68778d;line-height:1.6;font-size:14px}
.tabs{display:flex;gap:8px;margin:24px 0}
.tabs button{flex:1;padding:12px 5px;border:1px solid #d9e2ef;background:#f4f7fb;border-radius:9px;font-weight:bold;color:#344b68}
.tabs button.active{background:#1255a0;color:white;border-color:#1255a0}
label{display:block;font-size:14px;font-weight:bold;margin:16px 0 7px}
input{width:100%;padding:13px;border:1px solid #ccd6e4;border-radius:9px;font-size:15px}
input:focus{outline:2px solid #8bc8ff;border-color:#1255a0}
.primary{width:100%;margin-top:22px;padding:14px;background:#1255a0;color:white;border:0;border-radius:9px;font-size:16px;font-weight:bold}
.primary:disabled{opacity:.6}
#message{font-size:14px;line-height:1.5;margin-top:15px;overflow-wrap:anywhere}
.forgot{display:block;text-align:right;margin-top:14px;color:#1255a0;font-size:14px}
footer{text-align:center;color:#dce9f9;font-size:12px;margin-top:auto;padding:18px}
</style>
</head>
<body>
<header>Itrace<span>.</span></header>
<main>
<h1 id="heading">Welcome back</h1>
<p class="sub" id="description">Sign in to your Itrace client account.</p>

<div class="tabs">
<button type="button" id="signinTab" class="active">Sign In</button>
<button type="button" id="signupTab">Create Account</button>
</div>

<form id="authForm">
<label for="email">Email address</label>
<input id="email" type="email" autocomplete="email" placeholder="you@example.com" required>

<label for="password">Password</label>
<input id="password" type="password" autocomplete="current-password" minlength="8" placeholder="At least 8 characters" required>

<button class="primary" id="submitBtn" type="submit">Sign In</button>
</form>

<a href="#" class="forgot" id="forgot">Forgot your password?</a>
<p id="message" role="status" aria-live="polite"></p>
</main>
<footer>© 2026 Itrace. Keep your account details private.</footer>

<script type="module">
import { createClient } from
'https://esm.sh/@supabase/supabase-js@2';

const SUPABASE_URL = 'https://evhcxwhshcuedjrbxzr.supabase.co';
const SUPABASE_PUBLISHABLE_KEY = 'sb_publishable_ZL8UoP6pyWiVj81f7PMsfA_DIiMOWh8';

const supabase = createClient(
  SUPABASE_URL,
  SUPABASE_PUBLISHABLE_KEY
);

const form = document.getElementById('authForm');
const email = document.getElementById('email');
const password = document.getElementById('password');
const message = document.getElementById('message');
const submitBtn = document.getElementById('submitBtn');
const heading = document.getElementById('heading');
const description = document.getElementById('description');
const forgot = document.getElementById('forgot');
let mode = 'signin';

function showMode(nextMode) {
  mode = nextMode;
  message.textContent = '';
  password.value = '';
  document.getElementById('signinTab').classList.toggle('active', mode === 'signin');
  document.getElementById('signupTab').classList.toggle('active', mode === 'signup');
  heading.textContent = mode === 'signin' ? 'Welcome back' : 'Create your account';
  description.textContent = mode === 'signin'
    ? 'Sign in to your Itrace client account.'
    : 'Register with your email address and create a password.';
  submitBtn.textContent = mode === 'signin' ? 'Sign In' : 'Create Account';
  password.autocomplete = mode === 'signin' ? 'current-password' : 'new-password';
  forgot.style.display = mode === 'signin' ? 'block' : 'none';
}

document.getElementById('signinTab').addEventListener('click', () => showMode('signin'));
document.getElementById('signupTab').addEventListener('click', () => showMode('signup'));

form.addEventListener('submit', async (event) => {
  event.preventDefault();
  message.textContent = '';
  submitBtn.disabled = true;

  try {
    if (SUPABASE_PUBLISHABLE_KEY === 'sb_publishable_ZL8UoP6pyWiVj81f7PMsfA_DIiMOWh8') {
      throw new Error('Setup needed: add your Supabase Publishable key in the code first.');
    }

    let result;

    if (mode === 'signup') {
      result = await supabase.auth.signUp({
        email: email.value.trim(),
        password: password.value,
        options: {
          emailRedirectTo: 'https://nicej7630-cpu.github.io/itrace-website/'
        }
      });

      if (!result.error && !result.data.session) {
        message.textContent = 'Account request received. Check your email for a confirmation link before signing in.';
      } else if (!result.error) {
        message.textContent = 'Account created. You can now sign in.';
        showMode('signin');
      }
    } else {
      result = await supabase.auth.signInWithPassword({
        email: email.value.trim(),
        password: password.value
      });

      if (!result.error) {
        message.textContent = 'Signed in successfully. Your authentication is active, but the client dashboard has not been built yet.';
      }
    }

    if (result?.error) throw result.error;
  } catch (error) {
    message.textContent = error.message || 'Something went wrong. Please try again.';
  } finally {
    submitBtn.disabled = false;
  }
});

forgot.addEventListener('click', async (event) => {
  event.preventDefault();
  message.textContent = '';

  if (!email.value.trim()) {
    message.textContent = 'Enter your email address first, then tap Forgot your password again.';
    email.focus();
    return;
  }

  try {
    const { error } = await supabase.auth.resetPasswordForEmail(
      email.value.trim(),
      { redirectTo: 'https://nicej7630-cpu.github.io/itrace-website/' }
    );

    if (error) throw error;
    message.textContent = 'If the email can receive a reset message, check your inbox. Also check spam.';
  } catch (error) {
    message.textContent = error.message || 'Unable to request a password reset right now.';
  }
});
</script>
</body>
</html>
